name: Actualizar incidencias DGT

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  dgt:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Descargar DATEX2 DGT
        run: |
          set -e

          URL="https://nap.dgt.es/datex2/v3/dgt/SituationPublication/datex2_v37.xml"

          echo "Descargando incidencias DGT..."
          echo "URL: $URL"

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-delay 5 \
            --retry-all-errors \
            --connect-timeout 30 \
            --max-time 120 \
            -A "Mozilla/5.0 (compatible; TRAVEL-SAFE/1.0)" \
            -H "Accept: application/xml,text/xml,*/*" \
            "$URL" \
            -o dgt-datex.xml

          test -s dgt-datex.xml

          echo "XML descargado correctamente."
          echo "Tamaño:"
          wc -c dgt-datex.xml

      - name: Convertir DATEX2 a JSON
        run: |
          python - <<'PY'
          import json
          import re
          import xml.etree.ElementTree as ET
          from datetime import datetime, timezone

          INPUT = "dgt-datex.xml"
          OUTPUT = "dgt-incidents.json"

          def local_name(tag):
              if "}" in tag:
                  return tag.split("}", 1)[1]
              return tag

          def clean_text(element):
              if element is None:
                  return ""

              parts = []
              for item in element.itertext():
                  value = item.strip()
                  if value:
                      parts.append(value)

              return " ".join(parts)

          def descendants(element, names):
              wanted = {x.lower() for x in names}

              for child in element.iter():
                  if local_name(child.tag).lower() in wanted:
                      yield child

          def first_text(element, names):
              for child in descendants(element, names):
                  value = clean_text(child)

                  if value:
                      return value

              return ""

          def first_number(element, names):
              for child in descendants(element, names):
                  value = clean_text(child)

                  if not value:
                      continue

                  value = value.replace(",", ".")

                  try:
                      return float(value)
                  except ValueError:
                      continue

              return None

          def coordinates(element):
              result = []

              for node in element.iter():

                  lat = None
                  lon = None

                  children = list(node)

                  for child in children:
                      name = local_name(child.tag).lower()
                      value = clean_text(child).replace(",", ".")

                      try:
                          number = float(value)
                      except ValueError:
                          continue

                      if "latitude" in name:
                          lat = number

                      elif "longitude" in name:
                          lon = number

                  if lat is not None and lon is not None:

                      if -90 <= lat <= 90 and -180 <= lon <= 180:
                          result.append((lat, lon))

              if not result:

                  lat = first_number(
                      element,
                      [
                          "latitude",
                          "latitudeValue"
                      ]
                  )

                  lon = first_number(
                      element,
                      [
                          "longitude",
                          "longitudeValue"
                      ]
                  )

                  if (
                      lat is not None
                      and lon is not None
                      and -90 <= lat <= 90
                      and -180 <= lon <= 180
                  ):
                      result.append((lat, lon))

              unique = []

              for pair in result:

                  if pair not in unique:
                      unique.append(pair)

              return unique

          def normalize(value):

              value = value or ""

              value = re.sub(
                  r"([a-záéíóúñ])([A-ZÁÉÍÓÚÑ])",
                  r"\1 \2",
                  value
              )

              value = value.replace("_", " ")
              value = value.replace("-", " ")

              value = re.sub(
                  r"\s+",
                  " ",
                  value
              )

              return value.strip()

          print("Leyendo XML DGT...")

          tree = ET.parse(INPUT)
          root = tree.getroot()

          incidents = []

          situations = [
              element
              for element in root.iter()
              if local_name(element.tag).lower() == "situation"
          ]

          print(
              "Situaciones encontradas:",
              len(situations)
          )

          for situation_index, situation in enumerate(situations):

              situation_id = (
                  situation.attrib.get("id")
                  or situation.attrib.get("situationId")
                  or f"situation-{situation_index}"
              )

              records = [
                  element
                  for element in situation.iter()
                  if local_name(element.tag).lower()
                  == "situationrecord"
              ]

              if not records:
                  records = [situation]

              for record_index, record in enumerate(records):

                  coords = coordinates(record)

                  if not coords:
                      coords = coordinates(situation)

                  if not coords:
                      continue

                  event = first_text(
                      record,
                      [
                          "accidentType",
                          "constructionType",
                          "vehicleObstructionType",
                          "weatherRelatedRoadConditionType",
                          "nonWeatherRelatedRoadConditionType",
                          "roadMaintenanceType",
                          "networkManagementType",
                          "operatorAction",
                          "situationRecordType"
                      ]
                  )

                  if not event:
                      event = "Incidencia de tráfico"

                  description = first_text(
                      record,
                      [
                          "generalPublicComment",
                          "comment",
                          "description",
                          "value"
                      ]
                  )

                  road = first_text(
                      record,
                      [
                          "roadNumber",
                          "roadName",
                          "road"
                      ]
                  )

                  direction = first_text(
                      record,
                      [
                          "directionDescription",
                          "direction"
                      ]
                  )

                  municipality = first_text(
                      record,
                      [
                          "municipality",
                          "townName",
                          "localityName"
                      ]
                  )

                  province = first_text(
                      record,
                      [
                          "province",
                          "administrativeAreaName"
                      ]
                  )

                  severity = first_text(
                      record,
                      [
                          "severity",
                          "impact"
                      ]
                  )

                  start_time = first_text(
                      record,
                      [
                          "overallStartTime",
                          "situationRecordCreationTime",
                          "validityTimeSpecification"
                      ]
                  )

                  for coord_index, (lat, lon) in enumerate(coords):

                      incident_id = (
                          f"{situation_id}-"
                          f"{record_index}-"
                          f"{coord_index}"
                      )

                      incidents.append(
                          {
                              "id": incident_id,
                              "lat": lat,
                              "lon": lon,
                              "event": normalize(event),
                              "description": description,
                              "road": road,
                              "direction": direction,
                              "municipality": municipality,
                              "province": province,
                              "severity": severity,
                              "startTime": start_time
                          }
                      )

          unique = []
          seen = set()

          for incident in incidents:

              key = (
                  incident["id"],
                  round(incident["lat"], 5),
                  round(incident["lon"], 5)
              )

              if key in seen:
                  continue

              seen.add(key)
              unique.append(incident)

          payload = {
              "source": "DGT DATEX2 v3.7",
              "sourceUrl": (
                  "https://nap.dgt.es/datex2/v3/dgt/"
                  "SituationPublication/datex2_v37.xml"
              ),
              "generatedAt": datetime.now(
                  timezone.utc
              ).isoformat(),
              "count": len(unique),
              "incidents": unique
          }

          with open(
              OUTPUT,
              "w",
              encoding="utf-8"
          ) as file:

              json.dump(
                  payload,
                  file,
                  ensure_ascii=False,
                  indent=2
              )

          print(
              "Incidencias DGT procesadas:",
              len(unique)
          )

          print(
              "JSON generado:",
              OUTPUT
          )

          PY

      - name: Mostrar resultado
        run: |
          echo "Contenido generado:"
          ls -lh dgt-incidents.json

          python - <<'PY'
          import json

          with open(
              "dgt-incidents.json",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          print(
              "Incidencias:",
              data.get("count", 0)
          )

          print(
              "Generado:",
              data.get("generatedAt")
          )
          PY

      - name: Guardar incidencias DGT
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add dgt-incidents.json

          if git diff --cached --quiet; then
            echo "No hay cambios en las incidencias DGT."
          else
            git commit -m "Actualizar incidencias DGT"
            git push
          fi
