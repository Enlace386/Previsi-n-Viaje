name: Actualizar avisos AEMET

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  aemet:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Consultar AEMET
        env:
          AEMET_API_KEY: ${{ secrets.AEMET_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          from datetime import datetime, timezone

          API_KEY = os.environ["AEMET_API_KEY"]

          endpoint = (
              "https://opendata.aemet.es/opendata/api/"
              "avisos_cap/ultimoelaborado/area/esp"
          )

          print("Consultando AEMET...")
          print("Endpoint:", endpoint)

          req = urllib.request.Request(
              endpoint,
              headers={
                  "api_key": API_KEY,
                  "accept": "application/json",
                  "User-Agent": "TRAVEL-SAFE-GitHub-Actions"
              }
          )

          with urllib.request.urlopen(req, timeout=60) as response:
              raw = response.read()

          print("Respuesta inicial HTTP:", response.status)
          print("Content-Type:", response.headers.get("Content-Type"))
          print("Tamaño respuesta:", len(raw))

          text = raw.decode("utf-8", errors="replace")

          print("Primeros 1000 caracteres de la respuesta:")
          print(text[:1000])

          try:
              data = json.loads(text)
          except Exception as e:
              print("ERROR: la respuesta inicial no es JSON")
              print(repr(e))

              with open("aemet-debug-inicial.txt", "w", encoding="utf-8") as f:
                  f.write(text)

              raise

          print("Respuesta inicial JSON:")
          print(json.dumps(data, ensure_ascii=False, indent=2)[:5000])

          if data.get("estado") != 200:
              print("AEMET ha devuelto un estado diferente de 200.")
              print(json.dumps(data, ensure_ascii=False, indent=2))

          datos_url = data.get("datos")

          if not datos_url:
              print("AEMET no ha proporcionado la URL 'datos'.")

              with open("aemet-debug-inicial.json", "w", encoding="utf-8") as f:
                  json.dump(data, f, ensure_ascii=False, indent=2)

              raise RuntimeError("La respuesta de AEMET no contiene 'datos'")

          print("URL de datos AEMET:")
          print(datos_url)

          req2 = urllib.request.Request(
              datos_url,
              headers={
                  "User-Agent": "TRAVEL-SAFE-GitHub-Actions",
                  "accept": "*/*"
              }
          )

          with urllib.request.urlopen(req2, timeout=60) as response2:
              raw2 = response2.read()

              content_type = response2.headers.get("Content-Type", "")

          print("Respuesta datos HTTP:", response2.status)
          print("Content-Type datos:", content_type)
          print("Tamaño datos:", len(raw2))

          contenido = raw2.decode("utf-8", errors="replace")

          print("Primeros 3000 caracteres de los datos AEMET:")
          print(contenido[:3000])

          # Guardamos una copia de diagnóstico para inspeccionarla
          # en GitHub si fuera necesario.
          with open("aemet-debug-datos.txt", "w", encoding="utf-8") as f:
              f.write(contenido)

          # También guardamos la respuesta inicial.
          with open("aemet-debug-inicial.json", "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)

          # De momento NO intentamos interpretar el contenido.
          # Primero queremos saber exactamente qué devuelve AEMET.
          resultado = {
              "source": "AEMET OpenData",
              "generatedAt": datetime.now(timezone.utc).isoformat(),
              "status": "ok",
              "count": 0,
              "alerts": [],
              "debug": {
                  "endpoint": endpoint,
                  "datosUrl": datos_url,
                  "contentType": content_type,
                  "bytes": len(raw2)
              }
          }

          with open("aemet-alerts.json", "w", encoding="utf-8") as f:
              json.dump(resultado, f, ensure_ascii=False, indent=2)

          print("Diagnóstico guardado.")
          PY

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add aemet-alerts.json
          git add aemet-debug-inicial.json
          git add aemet-debug-datos.txt

          git diff --cached --quiet || git commit -m "Diagnosticar respuesta real de AEMET"

          git push
